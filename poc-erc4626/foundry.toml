[profile.default]
src = "src"
test = "test"
out = "out"
libs = ["lib"]
solc = "0.8.24"
optimizer = true
optimizer_runs = 200

# Run the invariant/fuzz campaign ONLY in Docker. Baseline values; heavy runs are done separately.
[profile.default.invariant]
runs = 256
depth = 64
fail_on_revert = false

[profile.default.fuzz]
runs = 256
# Seed pinning — reproducibility of the published RESULT numbers. Correctness must hold on other seeds too
# (verified on 2-3 seeds: OZ(offset=3) holds all of I1-I7). Fuzz/invariant campaigns use this seed.
seed = '0x4136'
